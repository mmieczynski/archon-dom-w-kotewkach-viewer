[project]
name = "kotewki"
version = "0.1.0"
description = "Dimensionally-verified 3D reconstruction of Dom w Kotewkach 6 (E)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0",
    "trimesh>=4.0",
    "manifold3d>=2.5",
    "numpy>=1.26",
    "pygltflib>=1.16",
    "jsonschema>=4.20",
    "Pillow>=10.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kotewki"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
